<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Size Chart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      padding: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    th, td {
      border: 1px solid #222;
      padding: 6px 12px;
      text-align: left;
      font-size: 14px;
      line-height: 1.2;
    }

    thead th {
      background: #b74c4c;
      color: #fff;
      font-weight: normal;
    }

    tbody tr:nth-child(1) td {
      background: #d79a9a;
    }

    tbody tr:nth-child(2) td {
      background: #f0dede;
    }

    tbody tr:nth-child(3) td {
      background: #e6e6e6;
    }

    tbody td:first-child,
    thead th:first-child {
      width: 120px;
    }
  </style>
</head>
<body>
  <table>
    <thead>
      <tr>
        <th>Part</th>
        <th>XS</th>
        <th>S</th>
        <th>M</th>
        <th>L</th>
        <th>XL</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Waist</td>
        <td>25</td>
        <td>28</td>
        <td>30</td>
        <td>31</td>
        <td>32</td>
      </tr>
      <tr>
        <td>Chest</td>
        <td>34</td>
        <td>34</td>
        <td>38</td>
        <td>40</td>
        <td>41</td>
      </tr>
      <tr>
        <td>Sleeve</td>
        <td>23</td>
        <td>24</td>
        <td>24</td>
        <td>25</td>
        <td>25</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
